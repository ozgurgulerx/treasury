site_name: Treasury - AI for Oil & Gas
site_description: Enterprise AI Solutions for the Energy Sector
site_author: Treasury Team

theme:
  name: material
  palette:
    # Dark theme - professional for energy sector
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/oil
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true
  - glightbox

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Use Case Classes:
    - T1 Cash & Liquidity (ALM): towers/t1-cash-liquidity.md
    - T2 FX / Rates / Commodity Risk: towers/t2-fx-risk-hedging.md
    - T3 Working Capital: towers/t3-working-capital.md
    - T4 Trade Finance & Collateral: towers/t4-trade-finance.md
    - T5 Investments & Funding: towers/t5-investments-funding.md
    - T6 Ops Automation & Controls: towers/t6-ops-automation.md
    - T7 Strategic Foresight: towers/t7-strategic-foresight.md
    - T8 Specialized (Refining): towers/t8-specialized-refining.md
    - T9 Experience Layer: towers/t9-experience-layer.md
  - About: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
  generator: false

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

